# Shared-hosting-style destination: every domain is served from
# /srv/www/<domain>/public_html, which is the unprivileged user's ~/www.
UseCanonicalName Off
<VirtualHost *:80>
    VirtualDocumentRoot /srv/www/%0/public_html
</VirtualHost>
<VirtualHost *:443>
    VirtualDocumentRoot /srv/www/%0/public_html
    SSLEngine on
    SSLCertificateFile /certs/site.crt
    SSLCertificateKeyFile /certs/site.key
</VirtualHost>
<Directory /srv/www>
    Options SymLinksIfOwnerMatch
    AllowOverride All
    Require all granted
</Directory>
